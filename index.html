        }

    function renderCalendar() {

            // Apply unique background theme for Scotland Match Days
            if (isMatchDay) {
                tile.className = "saltire-bg relative overflow-hidden border border-white/40 rounded-2xl p-4 flex items-center justify-between gap-4 shadow-md transition duration-150 cursor-pointer touch-manipulation active:scale-[0.99]";
            } else {

            }

            // High-contrast text values with clean legibility overrides
            const titleColorClass = isMatchDay ? "text-white font-black drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)]" : "text-slate-800";
            const badgeTextColorClass = isMatchDay ? "text-scotland-600 font-bold" : "text-usa-red";

            tile.innerHTML = `
                <div class="flex items-center space-x-4 min-w-0 flex-1 relative z-10">
                    <!-- Badge Background Container -->
                    <div class="flex flex-col items-center justify-center w-14 h-14 bg-white border border-slate-200/80 rounded-xl text-center shrink-0 shadow-sm">
                        <!-- Date badge text colors adaptive to background themes -->
                        <span class="text-[10px] font-bold ${badgeTextColorClass} uppercase tracking-wider pb-0.5">${day.date.split(' ')[0].substring(0,3)}</span>
                        <span class="text-xl font-black ${badgeTextColorClass} leading-none">${day.date.split(' ')[1]}</span>
                    </div>
                    <div class="min-w-0 flex-1">
                        <span class="font-bold ${titleColorClass} text-sm tracking-tight block truncate">${day.place}</span>
                    </div>
                </div>
                <!-- Clean, Maximum Sized Unboxed Icon Presentation -->
                <div class="shrink-0 text-4xl pr-1 select-none flex items-center justify-center relative z-10 drop-shadow-[0_1px_2px_rgba(0,0,0,0.2)]">
                    ${day.icon}
                </div>
            `;
            container.appendChild(tile);
        });
    }

    function openDetails(dayId) {
        const day = plannerData[currentTab].find(d => d.id === dayId);
        if (!day) return;

        document.getElementById('drawer-date').innerText = day.date;
        document.getElementById('drawer-place').innerText = day.place;
        document.getElementById('drawer-hotel').innerText = day.hotel;
        document.getElementById('drawer-plan').innerText = day.plan;

        // Dynamic Travel Formatting (Hide section if not present)
        const travelSection = document.getElementById('drawer-travel-section');
        const travelContent = document.getElementById('drawer-travel');
        
        if (day.travel) {
            travelSection.style.display = 'block';
            travelContent.innerText = day.travel;
        } else {
            travelSection.style.display = 'none';
        }

        const iconContainer = document.getElementById('drawer-icon-container');
        iconContainer.innerText = day.icon;

        // Dynamic Generation of World Cup Matches for Selected Day
        const wcSection = document.getElementById('drawer-wc-section');
        const wcContainer = document.getElementById('drawer-wc-games');
        wcContainer.innerHTML = ''; // Reset schedule container
        
        const fixturesToday = worldCupFixtures[day.date] || [];

        if (fixturesToday.length > 0) {
            wcSection.style.display = 'block';
            fixturesToday.forEach(match => {
                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 text-sm";
                
                // Bold highlight the home-nation Scotland matches
                const highlightText = match.teams.includes("Scotland") ? "font-bold text-scotland-600" : "font-medium text-slate-700";
                
                row.innerHTML = `
                    <span class="${highlightText}">${match.teams}</span>
                    <span class="text-xs font-bold text-slate-500 bg-slate-100 border border-slate-200/80 px-2 py-0.5 rounded shrink-0 ml-2 font-mono">${match.time}</span>
                `;
                wcContainer.appendChild(row);
            });
        } else {
            wcSection.style.display = 'none';
        }

        const overlay = document.getElementById('detail-overlay');
        const drawer = document.getElementById('detail-drawer');

        overlay.classList.remove('pointer-events-none');
        overlay.classList.add('opacity-100');
        drawer.classList.remove('translate-x-full');
    }

    function closeDetails() {
        const overlay = document.getElementById('detail-overlay');
        const drawer = document.getElementById('detail-drawer');

        overlay.classList.add('pointer-events-none');
        overlay.classList.remove('opacity-100');
        drawer.classList.add('translate-x-full');
    }

    // Initial load
    renderCalendar();
</script>
</body>
</html>
